---
# HassTurnOn - floor_domain
# example: 거실에 모든 조명 켜줘
# slots: {floor}, {domain}

language: "ko"
data:
  # lights
  - sentences:
      - "{floor}[에|의] [<all>] <light> [다|전부|모두|좀] [<turn>] 켜[줘|줄래]"
      - "[<all>] {floor} <light> [다|전부|모두|좀] [<turn>] 켜[줘|줄래]"
      - "{floor}에 있는 [<all>] <light> [다|전부|모두|좀] [<turn>] 켜[줘|줄래]"
      - "{floor}에 있는 [<all>] <light> 작동"
      - "[<all>] {floor} <light> 작동"
    example: "거실에 모든 조명 켜줘"
    inferred_domain: "light"
    response: "lights_floor"

  # fans
  - sentences:
      - "{floor}[에] [<all>] 팬 [다|전부|모두|좀] [<turn>] 켜[줘|줄래]"
      - "[<all>] {floor} 팬 [다|전부|모두|좀] [<turn>] 켜[줘|줄래]"
      - "{floor}에 [<all>] 팬 작동"
      - "[<all>] {floor} 팬 작동"
    example: "주방에 팬 켜줘"
    inferred_domain: "fan"
    response: "fans_floor"
