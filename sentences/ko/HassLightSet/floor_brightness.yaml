---
# HassLightSet - floor_brightness
# example: 침실 밝기를 50%로 설정
# slots: {floor}, {brightness}, {domain}

language: "ko"
data:
  # numeric brightness
  - sentences:
      - "{floor} 밝기를 {brightness}[ ][%|퍼센트|프로]로 [<numeric_value_set>]"
      - "{floor}의 밝기를 {brightness}[ ][%|퍼센트|프로]로 [<numeric_value_set>]"
      - "{floor}을 {brightness}[ ][%|퍼센트|프로] 밝기로 [<numeric_value_set>]"
      - "{floor} {brightness}[ ][%|퍼센트|프로]로 [<numeric_value_set>]"
      - "{floor}[의] [<light>[의]] 밝기[를] {brightness}[ ][%|퍼센트|프로][로] [<numeric_value_set>]"
    example: "침실 밝기를 50%로 설정"
    inferred_domain: "light"
    response: "brightness"

  # max/min brightness
  - sentences:
      - "{floor} 밝기를 {brightness_level:brightness}[로] [<numeric_value_set>]"
      - "{floor}의 밝기를 {brightness_level:brightness}[로] [<numeric_value_set>]"
      - "{floor} {brightness_level:brightness} 밝기[로] [<numeric_value_set>]"
      - "{floor} 밝기 {brightness_level:brightness}[로] [<numeric_value_set>]"
      - "{floor} {brightness_level:brightness}"
      - "{floor}[의] [<light>[의]] 밝기[를] {brightness_level:brightness}[로] [<numeric_value_set>]"
    example: "침실 밝기 최대로 설정"
    inferred_domain: "light"
    response: "brightness"
