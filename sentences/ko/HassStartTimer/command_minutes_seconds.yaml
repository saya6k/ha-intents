---
# HassStartTimer - command_minutes_seconds
# example: 5분 30초 후에 불 꺼줘
# slots: {conversation_command}, {minutes}, {seconds}

language: "ko"
data:
  - sentences:
      - "{timer_minutes:minutes}분 {timer_seconds:seconds}초 (후에|뒤에|있다가) {timer_command:conversation_command}"
    example: "5분 30초 후에 불 꺼줘"
    response: "command"
