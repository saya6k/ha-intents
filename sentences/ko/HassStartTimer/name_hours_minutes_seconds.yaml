---
# HassStartTimer - name_hours_minutes_seconds
# example: 1시간 5분 10초 피자 타이머 설정
# slots: {name}, {hours}, {minutes}, {seconds}

language: "ko"
data:
  - sentences:
      - "{timer_hours:hours}시간 {timer_minutes:minutes}분 {timer_seconds:seconds}초[짜리] {timer_name:name} 타이머 [<timer_set>]"
      - "{timer_name:name} 타이머 {timer_hours:hours}시간 {timer_minutes:minutes}분 {timer_seconds:seconds}초[으로|로] [<timer_set>]"
    example: "1시간 5분 10초 피자 타이머 설정"
    response: "default"
