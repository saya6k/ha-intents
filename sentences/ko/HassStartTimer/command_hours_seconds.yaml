---
# HassStartTimer - command_hours_seconds
# example: 1시간 10초 후에 불 꺼줘
# slots: {conversation_command}, {hours}, {seconds}

language: "ko"
data:
  - sentences:
      - "{timer_hours:hours}시간 {timer_seconds:seconds}초 (후에|뒤에|있다가) {timer_command:conversation_command}"
    example: "1시간 10초 후에 불 꺼줘"
    response: "command"
