---
# HassStartTimer - name_hours
# example: 1시간 피자 타이머 설정
# slots: {name}, {hours}

language: "ko"
data:
  - sentences:
      - "{timer_hours:hours}시간[짜리] {timer_name:name} 타이머 [<timer_set>]"
      - "{timer_name:name} 타이머 {timer_hours:hours}시간[으로|로] [<timer_set>]"
    example: "1시간 피자 타이머 설정"
    response: "default"
