---
# HassStartTimer - name_minutes
# example: 5분 피자 타이머 설정
# slots: {name}, {minutes}

language: "ko"
data:
  - sentences:
      - "{timer_minutes:minutes}분[짜리] {timer_name:name} 타이머 [<timer_set>]"
      - "{timer_name:name} 타이머 {timer_minutes:minutes}분[으로|로] [<timer_set>]"
    example: "5분 피자 타이머 설정"
    response: "default"
