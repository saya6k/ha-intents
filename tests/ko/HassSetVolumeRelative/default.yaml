---
# HassSetVolumeRelative - default

language: "ko"
tests:
  - sentences:
      - "소리 좀 키워줘"
      - "볼륨 올려"
    slots:
      volume_step: "up"
    response: "볼륨을 조절했습니다"
  - sentences:
      - "소리 줄여줘"
      - "볼륨 좀 낮춰"
    slots:
      volume_step: "down"
    response: "볼륨을 조절했습니다"
  - sentences:
      - "볼륨 10퍼센트 올려줘"
    slots:
      volume_step: 10
    response: "볼륨을 조절했습니다"
  - sentences:
      - "볼륨 10프로 줄여줘"
    slots:
      volume_step: -10
    response: "볼륨을 조절했습니다"
