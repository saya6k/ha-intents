---
# HassUnpauseTimer - seconds_only

language: "ko"
timers:
  - is_active: false
    start_seconds: 30
    total_seconds_left: 30
    rounded_hours_left: 0
    rounded_minutes_left: 0
    rounded_seconds_left: 30
tests:
  - sentences:
      - "30초 타이머 다시 시작"
      - "30초짜리 타이머 다시 시작"
    slots:
      start_seconds: 30
    response: "타이머를 다시 시작했습니다"
