---
# HassSetPosition - device_class

language: "ko"
areas:
  - name: "거실"
    floor: "일층"
floors:
  - name: "일층"
entities:
  - name: "창가 블라인드"
    domain: "cover"
    area: "거실"
    attributes:
      device_class: "blind"
  - name: "전동 셔터"
    domain: "cover"
    area: "거실"
    attributes:
      device_class: "shutter"
tests:
  - sentences:
      - "블라인드 50퍼센트로 내려줘"
      - "블라인드 50프로로 맞춰줘"
      - "블라인드 반만 내려줘"
    slots:
      domain: "cover"
      device_class: "blind"
      position: 50
    response: "블라인드 위치를 설정했습니다"
  - sentences:
      - "셔터 30퍼센트로 올려줘"
      - "루버 30프로로 맞춰줘"
    slots:
      domain: "cover"
      device_class: "shutter"
      position: 30
    response: "셔터 위치를 설정했습니다"
