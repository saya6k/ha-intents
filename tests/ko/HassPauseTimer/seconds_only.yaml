---
# HassPauseTimer - seconds_only

language: "ko"
timers:
  - is_active: true
    start_seconds: 30
    total_seconds_left: 30
    rounded_hours_left: 0
    rounded_minutes_left: 0
    rounded_seconds_left: 30
tests:
  - sentences:
      - "30초 타이머 일시정지"
      - "30초짜리 타이머 일시정지"
    slots:
      start_seconds: 30
    response: "타이머를 일시정지했습니다"
