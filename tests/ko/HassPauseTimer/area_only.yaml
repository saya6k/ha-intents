---
# HassPauseTimer - area_only

language: "ko"
areas:
  - name: "주방"
timers:
  - is_active: true
    area: "주방"
    start_minutes: 5
    total_seconds_left: 300
    rounded_hours_left: 0
    rounded_minutes_left: 5
    rounded_seconds_left: 0
tests:
  - sentences:
      - "주방 타이머 일시정지"
      - "주방에 있는 타이머 일시정지"
    slots:
      area: "주방"
    response: "타이머를 일시정지했습니다"
