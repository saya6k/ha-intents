---
# HassClimateSetTemperature - floor_temperature

language: "ko"
floors:
  - name: "1층"
areas:
  - name: "침실"
    floor: "1층"

entities:
  - name: "침실 온도조절기"
    domain: "climate"
    area: "침실"
    state: "20"
    attributes:
      current_temperature: 20

tests:
  - sentences:
      - "1층 온도 50도로 설정"
      - "1층 온도 50 로 설정"
    slots:
      floor: "1층"
      temperature: 50
    response: "온도가 설정되었습니다"
