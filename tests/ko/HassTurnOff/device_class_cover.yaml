---
# HassTurnOff - device_class_cover

language: "ko"
entities:
  - name: "차고 셔터"
    domain: "cover"
    attributes:
      device_class: "garage"
  - name: "거실 가리개"
    domain: "cover"
    attributes:
      device_class: "curtain"
  - name: "전동 루버"
    domain: "cover"
    attributes:
      device_class: "shutter"

tests:
  - sentences:
      - "차고문 닫아"
    slots:
      domain: "cover"
      device_class: "garage"
    response: "차고 문 닫았습니다"

  - sentences:
      - "커튼 닫아"
    slots:
      domain: "cover"
      device_class: "curtain"
    response: "커튼 닫았습니다"

  - sentences:
      - "루버 닫아"
    slots:
      domain: "cover"
      device_class: "shutter"
    response: "셔터 닫았습니다"
