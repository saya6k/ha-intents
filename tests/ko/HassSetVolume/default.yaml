# HassSetVolume - default

language: "ko"
tests:
  - sentences:
      - "볼륨 30퍼센트로 맞춰줘"
      - "소리를 30프로로 해"
      - "음량 30%로 설정"
      - "볼륨 30으로 올려줘"
    slots:
      volume_level: 30
    response: "볼륨을 설정했습니다"
  - sentences:
      - "볼륨 최대로"
      - "소리 가장 크게 해"
    slots:
      volume_level: 100
    response: "볼륨을 설정했습니다"
